<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
  </head>
  <body>

    <h1>My Top 3 Memories</h1>

    <button id="mem1-button">Show Memory #1</button>
    <button id="mem2-button">Show Memory #2</button>
    <button id="mem3-button">Show Memory #3</button>

    <p id="mem1" class="memory">Memory #1</p>
    <p id="mem2" class="memory">Memory #2</p>
    <p id="mem3" class="memory">Memory #3</p>

    <!-- Updated image links -->
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=100&h=100&fit=crop" />
    <img src="https://images.unsplash.com/photo-1536098561742-ca998e48cbcc??w=100&h=100&fit=crop" />
   <img src="https://images.unsplash.com/photo-1729297916825-fa738a49b98d?w=100&h=100&fit=crop" />
    <script>
      // ID and class selectors with jQuery methods
      $("#mem1-button").click(function () {
        $("#mem1").text("Swimming at the beach").css("color", "blue").addClass("highlight");
      });

      $("#mem2-button").click(function () {
        $("#mem2").text("Going to Japan").css("color", "green").addClass("highlight");
      });

      $("#mem3-button").click(function () {
        $("#mem3").text("Snowboarding Trip").css("color", "purple").addClass("highlight");
      });
    </script>

  </body>
</html>
